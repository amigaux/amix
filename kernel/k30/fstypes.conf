# fstypes.conf -- kernel/k30 in-kernel filesystem staging config.
#
# Read by build-cross-kernel.sh (section 1b) to stage extra in-kernel filesystems
# (whose kernel object is a PREBUILT `ld -r` relocatable from another repository) into
# the Amix kernel, paralleling how SCSI drivers are staged from a driver.conf.  This
# config lives in kernel/k30 so the FS provider repo (amix-cdfs) stays upstream-clean.
#
# It is a REUSABLE record -- a 2nd in-kernel filesystem is a one-line add.
#
# Grammar (one record per line; blank lines and '#' comments ignored):
#     fstype <name> <init-func> <exp-source-path> [flags] [md5=<32-hex>]
#
#   <name>            vfssw[] name string + the fs/<name>/ staging dir (e.g. cdfs)
#   <init-func>       the vsw_init routine the exp exports (e.g. cdfsinit)
#   <exp-source-path> the prebuilt `ld -r` relocatable to copy verbatim into
#                     fs/<name>/exp.  Resolved by tools/fstype-lib.sh as:
#                       $CDFS/<rest>  -> <rest> under the directory named by the CDFS
#                                        environment variable (a built amix-cdfs
#                                        checkout); the build refuses when the record
#                                        is active and CDFS is unset.  Write it
#                                        literally, `$CDFS/` -- it is not shell-expanded.
#                       /<abs>        -> used as is
#                       anything else -> relative to the kernel/k30 directory
#                     This exp is the cross-repo CONTRACT -- the harness copies it, it
#                     never compiles the fs from source.
#   [flags]           reserved (parsed + carried, not yet consumed); default 0
#   [md5=<32-hex>]    exp PROVENANCE PIN (tools/fstype-lib.sh enforces it): the
#                     build REFUSES if the object at <exp-source-path> does not
#                     md5-match.  The path names no revision: a provider checkout on an
#                     unvalidated branch once put a different object at the same path,
#                     and kernels linked against it panicked on remount.  Update the pin
#                     ONLY when deliberately adopting a new proven artifact.
#
# A build that wants no in-kernel filesystem (build-cross-kernel.sh --no-fstypes) reads
# no records at all and needs no CDFS.
#
# ---------------------------------------------------------------------------
# cdfs (ODFileSystem -> Amix, read-only ISO9660/RockRidge/Joliet/UDF).  ACTIVE.
# The prebuilt exp is amix-cdfs's kernel FS object (portable ODFS core + backends +
# cdfs_vfsops/cdfs_vnodeops/cdfs_node + the sdqueue media backend + kstring), exporting
# cdfsinit (the vsw_init routine).  build-cross-kernel.sh section 9 pulls the cross
# libgcc.a in for the fs's 64-bit soft-arith (__udivdi3/__umoddi3/__lshrdi3).
#
# Input: CDFS=<amix-cdfs checkout> in which `make amix-kernel` has written
# build/amix-kernel/libcdfskern.o.  One cdfs object serves both the 030 and the 060 line.
#
# Current pin: amix-cdfs af55633 ("Shrink the kernel block cache to 32 and never sleep on
# oversize kmem") -- md5 694a6e147e6ac418a9f604a16b0636cb, 97,611 B.  Fixes a mount wedge:
# the block cache is 32 blocks (a 67,596 B slab, 17 pages; was 264,204 B / 65 pages), and
# an oversize kmem request is KM_NOSLEEP (ENOMEM, never an uninterruptible sleep; see
# amix-cdfs docs/amix-kmem-oversize.md).  Link surface identical to the previous pin's
# (33 undefined symbols / 74 defined globals, same sets); no 68060-unimplemented
# instructions (scan060 clean).
#
# Earlier pins (each replaced by the one above it):
#   839553311ffa92b0b0b607988581a184  97,331 B  amix-cdfs b383d14  "Avoid 32x32->64
#       multiplies in the AMIX kernel object": the previous object carried 40 gcc
#       divide-by-constant `mulul/mulsl #magic,Dl,Dh` 64-bit products, which trap
#       (vector 61) on a real 68060.  Link surface unchanged; libgcc imports still only
#       __lshrdi3/__udivdi3/__umoddi3.
#   673cd9f43a928d0e57e3a9c32cecb9a4  96,366 B  amix-cdfs e0ef11a  "stop laundering mount
#       failures into EIO": sdopen() failure is ENXIO (ODFS_ERR_NO_DEVICE), a non-CD-ROM
#       INQUIRY peripheral type is ENOTTY (ODFS_ERR_NOT_OPTICAL), BAD_FORMAT/UNSUPPORTED
#       give EINVAL; EIO now means a real I/O error.  (Matters here: with the stock
#       support.c RAM-size guess the a3091 goes unregistered when Fast RAM extends below
#       0x07000000, so `mount -F cdfs 1,3` can address an empty card slot.)
#   58ff932f...                        96,198 B  amix-cdfs 9360542  "move the sdcom off the
#       per-process kernel stack": the sd layer was handed a stack-allocated sdcom; the
#       Amix kernel stack lives in the per-process u-area window, so the HBA completion
#       ISR dereferenced it in a foreign process context.  Fix: per-call
#       kmem_zalloc/kmem_free.
#   80635a1b...                        96,126 B  (carried the stack-sdcom defect)
# Before any of these, amix-cdfs b7efd23 made the object linkable into the kernel at
# all: kstring no longer DEFINES memcpy/strlen (they bind to the kernel's), and the media
# backend #includes <sys/inline.h> so spl0/spl2 inline.
fstype cdfs cdfsinit $CDFS/build/amix-kernel/libcdfskern.o 0 md5=694a6e147e6ac418a9f604a16b0636cb
