# kernel-patches.conf -- stock-kernel source patches a kernel build must carry BEFORE the
# D245 clean-gate, keyed by the repo that owns the patch file.  Parsed by tools/kpatch-lib.sh.
# The on-box kernel builders (kpatch_ensure_onbox; not part of kernel/k30 yet) act on every
# row; the host cross build (build-cross-kernel.sh) reads the `always:` rows through
# kpatch_always_extra.
#
# A row is acted on ONLY when its <driver-repo> is part of the current build, so a build
# that doesn't include that repo makes ZERO extra box calls and is byte-identical to a build
# without the row.  A driver dir matches a key when the basenames are equal after stripping a
# leading `amix-` from both (so the key `amix-a4091` matches kernel/drivers/a4091).
#
# ONE repo key is special: `k30` -- kernel/k30 itself (the key equals the basename of the
# kernel/k30 directory).  kernel/k30 is part of every build, so a row keyed to it ALWAYS
# applies.  That is how a fix to a STOCK kernel driver that no driver repo owns rides EVERY
# kernel built here.  Such a row is otherwise an ordinary row: kernel/k30 carries its patches
# under the same src/kernel-patches/ path the driver repos use, so build-cross-kernel.sh and
# amix-build pick them up by the same rule.
#
# A SECOND unconditional form is `always:<repo>` -- applies to every build, but the patch
# file stays in, and stays owned by, <repo>.  Use it for a patch to a STOCK driver that no
# driver repo owns but whose patch happens to have been WRITTEN inside one.  It costs a
# hard dependency: <repo> must be present for any build -- as one of the build's driver
# dirs, or under ${AMIX_DRIVERS:-kernel/drivers} as <repo> or <repo without amix-> (kpatch
# exits 2 if the patch file is missing -- a boot-critical patch is never silently skipped).
# Do not "fix" that by copying the patch here instead: build-cross-kernel.sh and amix-build
# glob EVERY *.patch in the src/kernel-patches/ of each dir they are given, so a second copy
# would be applied twice and their -F0 dry-run gate would hard-fail the build.  One copy;
# only the applies-when rule moves.
#
# Verify-then-apply, per row (the on-box builders):
#   * probe the on-box target for <marker> AND for the REVISION stamp beside it
#     (<onbox-target>.kprev).  Both agree (the normal already-patched case) => NO-OP: no
#     push, no recompile, same resulting kernel.
#   * otherwise -- marker ABSENT (a stock tree), or marker present with no matching
#     revision (a REVISED patch, or a tree patched before stamping existed) -- apply <patch>
#     to the pristine <stock> with host-side GNU patch (reliable; always a FORWARD apply,
#     never the flaky on-box patch(1) nor its "Reversed?" trap) and push the whole patched
#     file, then remove the matching .o (and the `exp=` subsystem exp, if the row names
#     one), write the stamp, and verify all three.
#
# The REVISION is derived from the patch + the pristine stock -- exactly the bytes that
# determine what would be pushed -- so it can never go stale and needs no edit here.  It
# exists because a marker is a PRESENCE token, not a version binding: revise a patch and
# keep its marker and every box carrying the old version silently no-ops.  The patches
# cannot carry a version themselves -- most live in a driver repo kernel/k30 only reads --
# so the binding lives beside the target instead.
#
# Grammar (one record per line; blank / '#'-comment lines ignored):
#   kpatch <driver-repo> <patch-rel-to-repo> <onbox-target> <marker> <stock> [key=value ...]
#
#   <driver-repo>            a driver repo key (e.g. amix-a4091; matched amix-insensitively
#                            against the basenames of the driver dirs passed to the builder),
#                            `always:<repo>`, or `k30` -- kernel/k30, which is in EVERY build
#   <patch-rel-to-repo>      the -p0 patch under that repo -- the SOURCE OF TRUTH (read-only
#                            for driver repos; kernel/k30 owns its own under src/kernel-patches/)
#   <onbox-target>           path under /usr/sys the patch targets; the sibling .o is invalidated
#   <marker>                 a regex-clean fixed token present in the target IFF the patch is
#                            applied (the idempotency guard -- plain `grep`, no metacharacters)
#   <stock>                  the byte-exact pristine stock the patch cleanly applies to:
#                            `usr/sys/<onbox-target>`, a path in the AMIX_SYSTEM input (a
#                            checkout of amigaux/amix-system), resolved as $AMIX_SYSTEM/usr/sys/...
#                            -- kpatch exits 2 when AMIX_SYSTEM is unset.  An absolute path is
#                            used as is; any other relative path resolves against kernel/k30.
#   exp=<rel-to-/usr/sys>    OPTIONAL.  Also remove this ONE subsystem exp when applying.
#                            Needed only where the subsystem's Makefile rule has NO
#                            prerequisites, so removing the .o cannot force a rebuild --
#                            `aen/exp :` + `cd aen; $(MAKE)` in amiga/driver/Makefile is the
#                            case (see the aen row).  It must be a single path ending in
#                            /exp: a GLOB IS REFUSED.  Over-broad exp deletion bricks the
#                            tree -- the generic SVR4 exp blobs ship pre-linked with no
#                            source.  amiga/alien/Makefile does NOT need it: its rule is
#                            `exp: $(OBJ) Makefile`, so an invalidated .o rebuilds normally.
#
# * support.c.patch is a LIVE row (below).  An older rule kept stock support.c unpatched
# because the patched WD33C93 probe failed under Amiberry; that rule is refuted (see WHY THE
# OLD RULE LOOKED TRUE), and kpatch-selftest.sh section 1 fails if its wording creeps back
# into this file.  The patch is REQUIRED for any kernel that runs with more than 16 MB of
# Fast RAM, which is every kernel built here: the 040/060 kernels run 128 MB on real
# hardware (Total Unix memory 134213632) and the arena-moved 030 kernel boots 88 MB.
#
# WHAT IT FIXES.  The A3000 internal SCSI is not an AutoConfig board, so it never appears in
# bootinfo.autocon[] and stock amiga/kernel/support.c:305 GUESSES it: the controller is
# synthesized at 0xDD0000 only when the kernel's own BSS `end` lands above 0x07000000 -- a
# RAM-SIZE guess.  At the 16 MB of 1992, Fast RAM is [0x07000000,0x08000000) and the kernel
# necessarily loads above the line, so the guess is true BY ACCIDENT and everything works.
# Extend Fast RAM DOWNWARD (64 MB => [0x04000000,0x08000000)), the kernel loads at 0x04xxxxxx,
# the guess goes false, and the a3091 is silently never registered.  Whether a given box trips
# it is a question of WHERE its RAM sits, not how much: the Z3660's 128 MB at 0x08000000 up
# keeps `end` above the line, amiberry's a3000mem_size grows downward from 0x08000000 and
# crosses it past 16 MB.  Nothing announces it: the SCSI cards renumber under everything, so
# the disk every profile calls 1,3 answers at 0,3 and a target at c6d0 does not exist at all.
# amix-a4091's support.c.patch replaces the guess with what the hardware answers -- a VPOSR
# chipset gate (ECS/OCS => A3000-class; AGA => A4000, skip) plus a two-register WD33C93
# write/readback probe through 0xDD0041/0xDD0043 -- and is therefore correct on BOTH machine
# classes this project supports.
#
# WHY THE OLD RULE LOOKED TRUE.  The ORIGINAL probe wrote 0x55 then 0xAA to the SAME WD33C93
# register and read it back.  Amiberry's open bus at 0xDD0000 is a per-address latch that echoes
# writes, so the readback always matched: every emulated ECS box grew a PHANTOM A3000, sd.c
# sorted it ahead of the A4091 by base address, and the install kernel's disk scan dispatched
# target 6 to a controller that was not there.  amix-a4091 adf3875 closed exactly that with the
# two-register anti-alias probe (a real chip keeps reg2 == 0x55; a per-address latch only holds
# the last write, 0xAA).  The patched install kernel passes the full install matrix at
# a3000mem_size=64 (stock 1,3 addressing) and, as a regression check, identically at 16.
#
# The host cross build applies the patch through its glob and reconciles that glob with the
# `always:` rows through tools/kpatch-lib.sh :: kpatch_always_extra, refusing rather than
# guessing when they disagree; the on-box builders apply the rows below.  A host-side builder
# reconstructs the target from the pristine stock; a builder that ships only the DIFF for the
# box's own patch(1) must check the marker and the .kprev revision on the box instead.
#
# CONSEQUENCE: every kernel built from this file links the probed support.c, so a kernel sum
# recorded against a stock-support.c build will NOT reproduce.  That is intended.
#
# NOTE on the a3091/a2091 markers: BOUNCESZ (not the older `chipaddr`) is the idempotency
# token, because it is unique to the PER-UNIT bounce fix (amix-a4091 791a117). The superseded
# single-static bounce patch also contained `chipaddr`, so a `chipaddr` marker would let kpatch
# skip re-applying the fix over a tree patched with the OLD patch. BOUNCESZ forces the correct
# re-patch (stock -> fixed) whenever the fixed patch is not already present.
#
# * a3091/a2091 are `always:` -- BOOT-CRITICAL, and NOT about the A4091 card.
# amiga/alien/a3091.c is the A3000 ONBOARD SCSI driver and a2091.c the A2091 card driver;
# both are in the stock amiga/alien Makefile and both are linked into EVERY kernel built
# here, exactly like aen.c.  Their patches only live in amix-a4091 because that repo did
# the work.  Keying them plainly to `amix-a4091` made the A3000 boot patch conditional on
# which UNRELATED third-party SCSI driver happened to be in the build -- so a kernel built
# with the z3660scsi driver and cdfs gated green and then could not mount root:
#     s5mountroot VOP_OPEN error 6 / PANIC: vfs_mountroot: cannot mount root: errno 30
# An emulated A3000 roots through the A3000 SCSI (c6d0s1, card 0), so this patch is
# load-bearing there; a real A4000+Z3660 that roots through the Z3660 is indifferent --
# which is why real hardware never caught it.
kpatch  always:amix-a4091  src/kernel-patches/a3091.c.patch  amiga/alien/a3091.c  BOUNCESZ  usr/sys/amiga/alien/a3091.c
kpatch  always:amix-a4091  src/kernel-patches/a2091.c.patch  amiga/alien/a2091.c  BOUNCESZ  usr/sys/amiga/alien/a2091.c
# * support.c is `always:` for the SAME reason, and the argument is if anything stronger.
# amiga/kernel/support.c is not a driver at all -- it is the machine-dependent boot/autoconfig
# code, linked into EVERY kernel built here (amiga/Makefile's O list names kernel/exp
# unconditionally).  No driver repo owns it; its patch lives in amix-a4091 only because that
# repo did the work, exactly like a3091/a2091.  And it is BOOT-CRITICAL in the same currency:
# support.c:305 is the a3091's ONLY registration point, so with the stock RAM-size guess and
# Fast RAM below 0x07000000 the A3000 controller never registers, the SCSI cards renumber, and
# the root/install device moves out from under every profile.  Keyed plainly to `amix-a4091`,
# a z3660scsi-only build on any box with more than 16 MB of Fast RAM would get the a3091
# BOUNCE fix (that row is `always:`) and lose the a3091 ITSELF -- a half-fixed kernel, and
# precisely the coupling the note above was written to end.  The `always:` cost is already
# paid: the two rows above make the a4091 driver a hard requirement of every build, so this
# row adds no new one.
#
# Marker `a3kscsi` is the probe's own result flag -- added by the patch, absent from stock (the
# stock line is the `end > (char *)0x07000000` guess, which declares no such variable).
#
# ! Unlike a3091/a2091's BOUNCESZ, this marker CANNOT tell the patch revisions apart: the
# superseded single-register probe declared `a3kscsi` too (amix-a4091 adf3875^), and there is no
# single-word token unique to the hardened version -- what adf3875 added is `*sasr = 0x03`, and a
# marker containing spaces cannot be parsed as a conf field.  No trick is needed: this is exactly
# what the .kprev REVISION binding exists for.  rev = sha1(patch + pristine stock), so a box
# carrying the OLD revision has the marker and a DIFFERENT stamp, reads as "marker present but NO
# matching revision", and is re-established from pristine stock -- stronger than any marker
# choice, because it is derived rather than declared.  The complementary guard is host-side:
# kpatch-selftest.sh section 1 asserts amix-a4091's patch still ADDS the reg-0x03 write and still
# REMOVES the 0x07000000 gate, so a regression to the spoofable probe fails the suite instead of
# shipping.
#
# NO `exp=`: amiga/kernel/Makefile links through
# `exp: $(OBJ)` with real prerequisites, so removing support.o rebuilds it and relinks kernel/exp
# normally -- the aen no-prerequisite trap does not apply here (kpatch-selftest.sh section 9
# guards the alien form of the same property).
kpatch  always:amix-a4091  src/kernel-patches/support.c.patch  amiga/kernel/support.c  a3kscsi  usr/sys/amiga/kernel/support.c
# scsi.c.patch stays CONDITIONAL on amix-a4091, deliberately.  It grows the gsioctl() GSIO
# iobuf 1 KB -> 64 KB, and that buffer is only reachable from the USERSPACE /dev/scsi ioctl
# path -- the in-kernel cdfs read path goes through sdqueue and never touches it, so it has
# nothing to do with the boot panic above.  Making it unconditional would also be actively
# unsafe: on a box whose Fast RAM all sits at 0x07000000, the 64 KB iobuf is >= the
# a3091/a2091 0x1000000 bounce threshold, and a GSIO transfer larger than BOUNCESZ (one 4 KB
# page) then hits `panic("a3091: DMA too big")` -- reachable from userland.  (Kernels built
# with the a4091 driver already carry that combination.)
kpatch  amix-a4091  src/kernel-patches/scsi.c.patch   amiga/alien/scsi.c   65536     usr/sys/amiga/alien/scsi.c
# aen.c.patch is OWNED BY kernel/k30 and therefore UNCONDITIONAL (see the `k30` note above):
# amiga/driver/aen/aen.c is the stock A2065 ethernet driver, linked into every Amix
# kernel via amiga/driver/Makefile's unconditional `aen/exp` -- no driver repo owns it, and
# every defect it closes is reachable from userland or the wire on any box carrying the
# driver: the trailer RX arm's out-of-bounds read + mblk heap overflow (from the wire), the
# aenioctl() NULL b_cont dereferences (any process that can open the device), and the three
# broken exits from aenioctl()'s switch -- an AEN_CLEAR_STATUS double free plus two
# AEN_SET_CONFIG double putnext()s of an already-handed-off message.
# Marker `aen_ioc_arg` is the ioctl-guard helper: unique to the patch, and since ALL of the
# fixes ship in this ONE patch its presence proves the whole set is applied.
#
# * `exp=amiga/driver/aen/exp` is LOAD-BEARING, and this row is why the option exists.
# amiga/driver/Makefile links aen through a NO-PREREQUISITE rule:
#     aen/exp :
#             cd aen; $(MAKE)
# An existing aen/exp is therefore always "up to date" and `cd aen; make` never runs -- so
# removing aen.o alone did nothing, the patched aen.c never reached the linked kernel, and
# the source-marker probe reported PRESENT forever.  Removing exactly this one exp is what
# makes the rebuild happen.  amiga/alien's rows need no such option: `exp: $(OBJ) Makefile`
# has real prerequisites.
kpatch  k30  src/kernel-patches/aen.c.patch  amiga/driver/aen/aen.c  aen_ioc_arg  usr/sys/amiga/driver/aen/aen.c  exp=amiga/driver/aen/exp
# The on-box size limit.  Stock sdpart.c sddevsize() answers 1234567 blocks (602.8 MiB) for a
# partition length it does not know and dd.c clamps every raw transfer to it, so on-box mkfs
# failed ENXIO on any slice ending past that block; a raw read STARTING past it went on with a
# negative residue and slept forever.  sdpart.c: the default becomes 0x3FFFFF (the largest
# whose *BSIZE fits a signed 32-bit offset); dd.c: an offset past the size returns ENXIO.
# Stock code no driver repo owns, so kernel/k30 carries it (always in the cross builder's glob,
# like aen.c); the 040/060 kernels get the same constant by their own route.
kpatch  k30  src/kernel-patches/sdpart.c.patch  amiga/alien/sdpart.c  SDBIGSIZE  usr/sys/amiga/alien/sdpart.c
kpatch  k30  src/kernel-patches/dd.c.patch  amiga/alien/dd.c  residue  usr/sys/amiga/alien/dd.c
# amix-gayle-ide: the Gayle IDE driver hooks int2_tbl in master.d/kernel.c; conditional on the
# driver being in the build (the patch applies at zero fuzz against the pristine stock,
# patch -p0 -F0).  No other row patches this file.
kpatch  amix-gayle-ide  src/kernel-patches/kernel.c.patch  master.d/kernel.c  ideintr  usr/sys/master.d/kernel.c
