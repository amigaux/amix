# kbootset.conf -- the kbootset floor of the kernel-space packages published
# before they carried it themselves: a kernel cut before its sidecar had
# kbootset-min= (C2-3 v10 section 2), a module package before its pkginfo had
# APKG_KBOOTSET (C2-2 v7).  gen-catalog puts the value on the package's
# catalog row as kbootset= (C2-2 v6 section 1.2, v7).
# "<catalog name> <version>: <kbootset version>", one published version per
# line.  A package that carries its own floor needs no line here; where both
# exist and differ, gen-catalog refuses the package.
# "module-floor-base: <kbootset version>" (C2-2 v8), at most one line: a
# module row whose floor is at or below it is written without kbootset=,
# and a major whose registry version is at or below it asks for no floor.
# 1.1.1 ships kbootset 1.1.0.261114-45, so its apkg 0.3.11, which refuses a
# keyed module row, takes those rows in its first upgrade.  Kernel rows keep
# their key.
module-floor-base: 1.1.0.261114-45
kernel-k30-m k30.1.4.261101-68: 1.1.0.261102-35
kernel-k46-m k46.1.4.261101-56: 1.1.0.261102-35
kernel-k46-m k46.1.4.261101-57: 1.1.0.261102-35
xsurf-k30 1.0.0-3: 1.1.0.261114-45
xsurf-k46 1.0.0-3: 1.1.0.261114-45
