# kbootset.conf -- the kbootset floor of the kernel packages cut before
# their sidecar carried kbootset-min= (C2-3 v10 section 2): gen-catalog puts
# the value on the kernel's catalog row as kbootset= (C2-2 v6 section 1.2).
# "<catalog name> <version>: <kbootset version>", one published version per
# line.  A kernel whose sidecar has kbootset-min= needs no line here; where
# both exist and differ, gen-catalog refuses the package.
kernel-k30-m k30.1.4.261101-68: 1.1.0.261101-34
kernel-k46-m k46.1.4.261101-56: 1.1.0.261101-34
kernel-k46-m k46.1.4.261101-57: 1.1.0.261101-34
