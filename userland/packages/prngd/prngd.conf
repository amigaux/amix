# prngd.conf -- entropy-gathering commands for Commodore Amiga Unix (SVR4.0).
#
# Format: "program args" /absolute/path bits-per-byte-of-output.  Every path
# exists on a stock Amix install (checked on the box, 2026-10-30); the rates
# are prngd's conservative ones for comparable SVR4 systems (contrib/ATT-NCR).
# A quiet 1992 box changes little between samples: this is a bridge to a
# real /dev/random, not a replacement for one.

"ps -efl" /usr/bin/ps 0.03
"ls -alni /tmp" /usr/bin/ls 0.02
"ls -alni /var/tmp" /usr/bin/ls 0.01
"ls -alni /var/adm" /usr/bin/ls 0.02
"ls -alni /proc" /usr/bin/ls 0.02
"netstat -an" /usr/bin/netstat 0.05
"netstat -in" /usr/bin/netstat 0.02
"ipcs -a" /usr/bin/ipcs 0.01
"df" /usr/bin/df 0.01
"who -a" /usr/bin/who 0.01
"last" /usr/bin/last 0.01
"w" /usr/ucb/w 0.01
"arp -a" /usr/sbin/arp 0.01
"tail -50 /var/cron/log" /usr/bin/tail 0.01
