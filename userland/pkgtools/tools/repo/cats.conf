# cats.conf — authored category taxonomy for the Amix package repo.
#
# The stock Amix 2.1 metadata carries no useful taxonomy: all 27 factory
# packages ship CATEGORY=system, which collapses the whole distribution into
# one undifferentiated heap.  This file is the fix, applied at CATALOG level:
# gen-catalog.py reads it from the staging root and it wins over the pkginfo
# CATEGORY, so a package is re-categorised WITHOUT being re-minted — no .pkg
# byte moves, no .pkg md5 moves, no installed-package digest moves.  Exactly
# the deps.conf pattern, one field over.
#
# Format: two statements, one per line ('#' comments and blank lines ignored):
#
#     <catalog-name>: <category>     assign a package to a group
#     @group <token>: <gloss>        DECLARE a group (the vocabulary)
#
# Assignment keys are matched against the catalog name first (lowercase, post
# names.conf mapping) and against the pkginst (PKG) as a fallback; a package
# absent here keeps whatever its pkginfo CATEGORY says.
#
# A category must be ONE token matching [A-Za-z0-9][A-Za-z0-9+.-]* — apkg's
# catalog parser rejects the whole catalog if the category field holds a
# space, so gen-catalog.py refuses a spacey override here rather than minting
# a catalog no client can read.
#
# THE @group LINES ARE THE VOCABULARY, AND IT IS CLOSED.  They used to be a
# comment block, which could rot against the assignments below it and gave a
# second repo nothing to check itself against.  Now gen-catalog.py refuses an
# assignment naming an undeclared group (per-package SKIP, same as a spacey
# one) and warns when a package falls through to a pkginfo CATEGORY outside
# the vocabulary.  A staging cats.conf with no @group line declares nothing
# and keeps the old permissive behaviour, so the fixtures still work.
#
# Adding a group is CHEAP — one @group line, re-run gen-catalog.py, and no
# .pkg byte moves.  That is the reason to under-split rather than over-split
# below: a group that turns out to be needed costs one line to add later,
# while a group minted too early is a menu heading with one thing under it
# forever.
#
# Pure metadata: edit this file and re-run gen-catalog.py — no rebuild.
#
# ---------------------------------------------------------------------------
# THE AXIS.  Categories describe what a package IS (which subsystem or class
# of tool it belongs to).  They deliberately do NOT encode who wants it — that
# is what the named install sets in sets.conf are for, and duplicating the
# intent axis here would give the menu two disagreeing groupings of the same
# packages.  Concretely: `xdev` and `oldev` are filed under x11 (they are part
# of the X stack), not under development; the Developer SET is what pulls
# them in.  `development` is left for the things whose whole purpose is
# building software — the AT&T C compiler and the kernel relink kit.
#
# The same rule settles the question the third-party layer raises.  Packages
# built from amix's userland/packages recipes are add-ons, not part of the
# Amix 2.1 distribution — but "shipped by Commodore vs. ported by us" is
# PROVENANCE, i.e. who wants it and where it came from, not what it is.  So
# it gets no category: it is the `extra` set in sets.conf.  A GNU tool is
# filed by what it does, beside the stock package that does the same job.
#
# Fifteen groups (owner, 2026-10-30; the same closed list as pkgmeta's):

@group system:        the base OS and the machinery that administers it
@group network:       TCP/IP and UUCP userland, and the clients that speak it
@group utility:       general-purpose command-line tools
@group archive:       archivers and compressors
@group library:       libraries other packages link against
@group shell:         command interpreters
@group language:      programming-language implementations
@group text:          text processing / document formatting
@group editor:        interactive editors, GNU Emacs included
@group documentation: the manual pages
@group development:   compiler, kernel configuration, and build tooling
@group multimedia:    sound, images and video
@group x11:           the X Window System stack and the OPEN LOOK toolkit
@group games:         games
@group source:        source trees — read them, build them, or skip them

# `source` is the big one: 7 packages, ~155 MB of the ~274 MB stock total,
# which is exactly why it deserves to be foldable in a menu.
#
# ---------------------------------------------------------------------------
# THE GROUPS ADDED FOR THE THIRD-PARTY USERLAND.
#
# `utility` is not a junk drawer, it is the category the stock taxonomy never
# needed.  Commodore bundled the whole general-purpose userland into `core`
# and `bsd`, so there was nothing left over to name; a repo that ships gzip,
# tar, bash and coreutils as separate packages has ~10 of them and no bucket.
# It is the peer of `text` (format documents), `network` (talk to other
# machines) and `development` (build software): "the general command-line
# tools you drive the box with".
#
# The line against `text` is subject matter, not file type.  Stock `text` is
# the Documenter's Workbench — troff, nroff, tbl, eqn, spell — tools whose
# purpose is producing a formatted document.  grep, diff, less and the like
# are general tools that happen to read text; filing them under `text` would
# redefine that group as "anything textual" and leave a heading that tells a
# user nothing.  They are `utility`.
#
# `editor` earns its heading on how people look for it.  "Which editor can I
# get?" is the first question on a fresh box, and a user scanning for it will
# not look under "Text processing".  Since 2026-10-30 it also holds stock
# `emacs`, which had a footprint group of its own.
#
# 2026-10-30 (owner): `archive`, `library`, `shell`, `language` and
# `multimedia` added; `emacs` folded into `editor` and `openlook` into `x11`.
# Each move is a catalog field only: no .pkg byte moves.

# ---- base OS + administration ----
core:       system
bsd:        system
lp:         system
public:     system
sysadm:     system
terminfo:   system

# ---- our own packages (were CATEGORY=application) ----
# apkg + the heirloom engine ARE the package system, and cdfs ships the
# mount helper for the CD filesystem whose kernel side lives in core.  All
# three are base-OS machinery, not user applications.
apkg:       system
apkgeng:    system
cdfs:       system

# ---- networking ----
net:        network
uucp:       network

# ---- text processing ----
text:       text

# ---- documentation ----
man:        documentation

# ---- development ----
# Cdev = the AT&T C development system; conf = the kernel relink kit.  Both
# exist to build things.  (Neither is a dependency of anything: see the
# "no 'you need a compiler' deps" principle in deps.conf.)
cdev:       development
conf:       development

# ---- X Window System, OPEN LOOK included ----
xcore:      x11
xbasic:     x11
xtras:      x11
xdev:       x11
olcore:     x11
oldev:      x11

# ---- editors ----
emacs:      editor

# ---- games ----
games:      games

# ---- source trees ----
amigasrc:   source
emacsrc:    source
gnusrc:     source
gnusrc2:    source
pubsrc:     source
xsource:    source
x11r5src:   source

# ---- add-ons: BATCH-1 populated 2026-09-16 ----
# BATCH-1 (published 2026-09-15; landed in sets.conf's `extra` 2026-09-16)
# assigned below, matching the category each package's own pkginfo already
# carries — no override was needed in the catalog itself (NOTES.md
# 2026-09-15).  Exception since 2026-10-30: gzip is `archive` here while its
# pkginfo still says `utility`, so this line overrides the catalog field.
#
# ★ STAGED SINCE 2026-09-26 (decision of the 2026-09-26 consolidation review: the
# taxonomy goes live at the next publish).  build-packages.sh now copies this file into staging beside
# deps.conf/descs.conf/names.conf, so every assignment in it reaches the
# catalog the next time one is generated and published.  Until then it was
# deliberately kept out of staging and moved no published catalog byte.  The
# expected per-line diff against the live catalog is in NOTES.md (2026-09-26,
# PREPARED publish).
grep:       utility
gzip:       archive
less:       utility
acompat:    development
patch:      development
zlib:       development

# amix-benchmark (published 2026-09-16; catalog 38 -> 39).  Our own amix-bench
# suite, filed by what it does, beside every other general command-line tool.
# `utility` is what its pkginfo already carries, so this line overrides nothing
# in the catalog -- it is here because T15 requires cats.conf to name exactly
# the packages the install sets name, and the set membership below is the
# thing that is actually new.
#
# ★ Note the KEY.  cats.conf is keyed on the CATALOG name, and this is the
# first package whose catalog name is not its pkginst: the instance is
# `amixbench` (9 chars, the SVR4 ceiling), the catalog name is the 14-char
# `amix-benchmark`.  See names.conf.  The pkginst matches as a fallback, so
# either key would resolve -- the catalog name is the correct one.
amix-benchmark: utility

# tar and make (amix-packages batch-2, staged 2026-09-26; landed in
# sets.conf's `extra` the same day).  make's category matches its pkginfo;
# tar's pkginfo says `utility`, and since 2026-10-30 this line overrides it
# to `archive` (catalog field only, no .pkg byte moves).  Both lines are here
# because T15 requires cats.conf to name exactly the packages the install
# sets name.  tar's catalog name is `tar` (its PKG instance is the 9-char
# `gtar` -- see names.conf); make needs no name override.
tar:        archive
make:       development

# The agreed mapping for the registry's first 23 packages (BATCH-1 is the
# first six of these; the rest land here as they publish):
#   utility      bash coreutils diffutils grep less screen
#   archive      bzip2 gzip infozip tar
#   editor       elvis joe
#   network      cryanc dropbear rsync wget
#   development  libamixcompat make patch perl zlib
#   system       prngd top

# GCC 14 batch (amix-packages, assigned 2026-10-30): diffutils and coreutils are
# general command-line tools; bzip2 is the third archiver.  Each line matches
# the CATEGORY its package.sh already carries.  Keys are catalog names: the
# PKG instances are the 8-char `diffutil` and `coreutil` (see names.conf).
diffutils:  utility
coreutils:  utility
bzip2:      archive

# ---- deliberately NOT listed ----
# m4 -- the stock /usr/ccs/bin/m4 alone (2026-10-26), the syslog.conf
# preprocessor core's syslogd needs.  Its group is `system` (base-OS
# machinery, not a build tool here), and its pkginfo already says
# CATEGORY=system, so the catalog shows `system` without a line here.  The
# line waits for set membership: the test suite (T15) ties this file to exactly
# the packages the install sets name, and the sets are locked (sets.conf).
# When m4 joins a set, add `m4: system` above.
# amixdemo / demolib — the apkg E2E test fixtures.  Their pkginfo already
# says CATEGORY=test and they must stay distinguishable as fixtures.
# KERNBENCH / KERNZ3660 — PRIVATE kernel packages; they never reach a
# redistributable catalog at all (gen-catalog.py refuses them on the
# KSUM_R/BOOT2_SHA markers), so a category for them would be meaningless.
