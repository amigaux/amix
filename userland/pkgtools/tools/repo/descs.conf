# descs.conf -- authored DESCRIPTION overrides for the Amix package repo.
#
# The catalog's ninth column is the only prose a user ever sees about a
# package: it is what `apkg list`, `apkg search` and `apkg info` print and
# what the installer menu shows beside the name.  Until this file existed
# that column was a pure function of the package's own pkginfo
# (APKG_DESC, falling back to NAME), so saying anything NEW about a
# package that is already published -- an operator note, a migration
# warning, a correction -- meant re-minting the .pkg.  Re-minting moves
# the .pkg md5, which moves the catalog line, which invalidates every
# digest and every gate result recorded against it, for a change that
# touches no installed byte.
#
# So this is the deps.conf / cats.conf pattern applied one field over:
# gen-catalog.py reads descs.conf from the STAGING ROOT and it wins over
# pkginfo, so a description is rewritten WITHOUT re-minting -- no .pkg
# byte moves, no .pkg md5 moves, no installed-package digest moves.  The
# only bytes that change are the catalog's own.
#
# Format: one statement per line, '#' comments and blank lines ignored:
#
#     <catalog-name>: <free text>
#
# The key is matched against the catalog name first (lowercase, post
# names.conf mapping) and against the pkginst (PKG) as a fallback; a
# package absent here keeps whatever its pkginfo says.  Only the FIRST
# colon separates key from value, so the text may contain as many more
# as it likes.
#
# What the text may NOT contain:
#   - a '|', the catalog field separator.  gen-catalog.py refuses the
#     line rather than silently rewriting it to '/' (a silent rewrite of
#     an authored sentence is worse than a refusal).
#   - nothing at all: an empty override is refused too, because it is
#     almost always a truncated line and it would BLANK a description the
#     pkginfo did supply.  Delete the line to fall back to pkginfo.
#   - so much text that the assembled catalog line passes apkg's 2048-byte
#     per-line read buffer.  That is a whole-catalog rejection in the
#     client, not a one-line one, so gen-catalog.py fails closed on it
#     (Gate 8) instead of writing a catalog no box can read.  Budget
#     roughly 1.8 kB of description; in practice keep it to a sentence or
#     two, because the installer menu and `apkg list` show it on one line.
#
# Pure metadata: edit this file and re-run gen-catalog.py -- no rebuild.
#
# ---------------------------------------------------------------------------
# STAGING.  build-packages.sh copies this file into the staging root beside
# deps.conf, and the publish path should stage it the same way.  descs.conf
# is safe to stage at any time: it holds exactly the packages listed below,
# so staging it moves exactly those lines and no others.  Keep that property
# -- a description override for a package we did not mint should be argued
# for first.  (cats.conf is staged too since 2026-09-26, but on a different
# argument -- it DOES move stock lines, on purpose; see build-packages.sh.)
#
# ---------------------------------------------------------------------------

# apkg -- the client itself.  Its pkginfo APKG_DESC is the plain one-liner
# ("Remote package client: update/list/search/install over HTTP"); what the
# catalog needs to carry on top of it is the 0.1 -> 0.2 UPGRADE TRAP, and
# the catalog is the one place every 0.1 box will look before it acts.
#
# The trap (metal, A4000D/68LC060, 2026-09-16): `apkg upgrade apkg` in 0.1
# runs `pkgrm APKG` and then a pkgadd that needs /var/apkg/admin -- which
# the pkgrm has just deleted, because the APKG package owns it as an `e`
# entry.  The pkgadd dies with "unable to open admin file" and the box is
# left with apkg REMOVED and not reinstalled.  0.2 fixes it, but a 0.1 box
# runs the 0.1 code to get there, so the fix cannot help the box that needs
# it -- hence the warning lives in the catalog a 0.1 box reads.
apkg: Remote package client: update/list/search/install over HTTP. Boxes on apkg 0.1: do NOT run 'apkg upgrade apkg' (it removes apkg); migrate with 'apkg download apkg' + stock pkgadd, see NOTES.
