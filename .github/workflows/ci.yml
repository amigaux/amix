# CI for amix: the privacy check over what a push or pull request adds, the
# privacy check's self-test, the host tests that need no Amiga and no cross
# compiler, and the dlm kit and modules built in the build container with
# the pinned toolchains. Not required for merges. See docs/ci.md.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: privacy check (public classes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: privacy check over the new commits
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # CI has no maintainer's local list: PRIVACY_PATTERNS and
          # PRIVACY_BLOCKED are unset, so only the public classes run.
          echo "privacy-check: public rules only (no local list in CI)"
          if [ "$EVENT" = pull_request ]; then
            set -- --range "$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! expr "$PUSH_BEFORE" : '0*$' >/dev/null \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            set -- --range "$PUSH_BEFORE..$PUSH_AFTER"
          else
            set -- --all "$PUSH_AFTER"
          fi
          echo "privacy-check $*"
          env -u PRIVACY_PATTERNS -u PRIVACY_BLOCKED tools/privacy-check "$@"

  tests:
    name: host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: host packages
        run: |
          sudo apt-get -o Acquire::Retries=10 update -q
          sudo apt-get -o Acquire::Retries=10 install -q -y --no-install-recommends zlib1g-dev
      - name: privacy-check self-test
        run: tools/test-privacy-check
      - name: kernel/dlm host tests
        run: make -C kernel/dlm test
      - name: kernel/modules monsw host test
        run: make -C kernel/modules/monsw/module test
      - name: kernel/modules ramdisk host test
        run: make -C kernel/modules/ramdisk/module test
      - name: build/pkg host tests
        run: make -C build test
      - name: toolchain host tests (distfile fetch, m68k-gnu-bin)
        run: sh toolchain/test-tools
      - name: userland packages check (packages, base/pkg)
        run: make -C build check-packages

  kit:
    name: kit build (container)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write   # only to drop superseded toolchain images from the cache
    defaults:
      run:
        shell: bash   # -eo pipefail: a failure before | tee fails the step
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: amix-system at its pin, checked
        run: system/fetch-amix-system "$RUNNER_TEMP/amix-system"
      - name: restore the toolchain image
        id: image
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/toolchain-image
          key: amix-toolchain-${{ hashFiles('toolchain/Containerfile', 'toolchain/*.pin', 'toolchain/container-build.sh', 'system/amix-system.pin', 'system/MANIFEST.sha256', 'system/SYMLINKS', 'system/check-amix-system') }}
      # A restore can fail on the cache service's side ("Egress is over the
      # account limit", a throttle) though the entry exists: try once more
      # before building the image from scratch.
      - name: restore the toolchain image, second try
        id: image2
        if: steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/toolchain-image
          key: ${{ steps.image.outputs.cache-primary-key }}
      - name: build the toolchain image
        if: steps.image.outputs.cache-hit != 'true' && steps.image2.outputs.cache-hit != 'true'
        run: |
          toolchain/container-build.sh "$RUNNER_TEMP/amix-system" amix-toolchain:ci
          mkdir -p "$RUNNER_TEMP/toolchain-image"
          docker save amix-toolchain:ci | zstd -q -T0 -o "$RUNNER_TEMP/toolchain-image/image.tar.zst"
          ls -l "$RUNNER_TEMP/toolchain-image"
      - name: save the toolchain image
        if: steps.image.outputs.cache-hit != 'true' && steps.image2.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/toolchain-image
          key: ${{ steps.image.outputs.cache-primary-key }}
      # One image is about 650 MB of the repository's 10 GB cache: once master
      # has saved a new one, the images of older keys go.
      - name: drop the superseded toolchain images
        if: github.event_name == 'push' && steps.image.outputs.cache-hit != 'true' && steps.image2.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.image.outputs.cache-primary-key }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key amix-toolchain- --limit 100 \
              --json id,key --jq '.[] | select(.key != env.KEEP) | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "dropping $key"
              gh cache delete --repo "$GITHUB_REPOSITORY" "$id"
            done
      - name: load the toolchain image
        if: steps.image.outputs.cache-hit == 'true' || steps.image2.outputs.cache-hit == 'true'
        run: zstd -dc "$RUNNER_TEMP/toolchain-image/image.tar.zst" | docker load
      - name: the image's gcc14 is the pinned build
        run: toolchain/extract-g14.sh --check amix-toolchain:ci
      - name: dlm kit, kit tests and modules
        run: toolchain/container-kit.sh amix-toolchain:ci | tee "$RUNNER_TEMP/kit.txt"
      - name: packaging harness selftests
        run: |
          # The runner's uid has no name in the image, and the pkgtools smoke
          # tests ask for one: the image's passwd and group, plus that uid.
          ids=$RUNNER_TEMP/ids; mkdir -p "$ids"
          docker run --rm amix-toolchain:ci cat /etc/passwd > "$ids/passwd"
          docker run --rm amix-toolchain:ci cat /etc/group > "$ids/group"
          awk -F: -v u="$(id -u)" '$3 == u { f = 1 } END { exit !f }' "$ids/passwd" ||
            echo "builder:x:$(id -u):$(id -g)::/tmp:/bin/sh" >> "$ids/passwd"
          awk -F: -v g="$(id -g)" '$3 == g { f = 1 } END { exit !f }' "$ids/group" ||
            echo "builder:x:$(id -g):" >> "$ids/group"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GITHUB_ACTIONS \
            -v "$ids/passwd:/etc/passwd:ro" -v "$ids/group:/etc/group:ro" \
            -v "$PWD:/src" -w /src amix-toolchain:ci make -C build selftests
      - name: kit and module hashes
        run: |
          {
            echo '### Kit and module hashes'
            echo '```'
            grep -E '^(port|kit|module) ' "$RUNNER_TEMP/kit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
