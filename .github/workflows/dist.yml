# The proof of make dist: two make dist runs of one commit, from
# two clean clones at two different paths and on two filesystems, in the pinned
# build container, and their locks compared; with a lock of record, each run is
# also checked against it. Run by hand for now. See docs/ci.md.
name: dist

on:
  workflow_dispatch:
    inputs:
      lock:
        description: 'lock of record to check both runs against (release/amix-<version>.lock), or empty'
        required: false
        default: ''
      cold_image:
        description: 'build the toolchain image from scratch, compare it with the cached one, and use it'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    name: make dist twice
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    defaults:
      run:
        shell: bash   # -eo pipefail
    steps:
      - name: the runner
        run: |
          { echo '### the runner'; echo '```'
            sed -n 's/^model name[^:]*: //p' /proc/cpuinfo | head -1
            echo "$(nproc) CPUs, kernel $(uname -r)"; free -m; df -hT / /mnt "$RUNNER_TEMP" /dev/shm || true
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # a package's epoch is its directory's last commit
          persist-credentials: false
      - name: amix-system at its pin, checked
        run: system/fetch-amix-system "$RUNNER_TEMP/amix-system"
      # The same image and cache key as ci.yml's kit job: one image for both.
      - name: restore the toolchain image
        id: image
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/toolchain-image
          key: amix-toolchain-${{ hashFiles('toolchain/Containerfile', 'toolchain/*.pin', 'toolchain/container-build.sh', 'toolchain/sysroot-links', 'system/amix-system.pin', 'system/MANIFEST.sha256', 'system/SYMLINKS', 'system/check-amix-system') }}
      - name: restore the toolchain image, second try
        id: image2
        if: steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/toolchain-image
          key: ${{ steps.image.outputs.cache-primary-key }}
      - name: load the toolchain image
        if: steps.image.outputs.cache-hit == 'true' || steps.image2.outputs.cache-hit == 'true'
        run: zstd -dc "$RUNNER_TEMP/toolchain-image/image.tar.zst" | docker load
      - name: build the toolchain image
        if: inputs.cold_image || (steps.image.outputs.cache-hit != 'true' && steps.image2.outputs.cache-hit != 'true')
        timeout-minutes: 210
        env:
          HIT: ${{ steps.image.outputs.cache-hit == 'true' || steps.image2.outputs.cache-hit == 'true' }}
          NO_CACHE: ${{ inputs.cold_image && '1' || '' }}
        run: |
          if [ "$HIT" = true ]; then docker tag amix-toolchain:ci amix-toolchain:cached; fi
          start=$(date +%s)
          toolchain/container-build.sh "$RUNNER_TEMP/amix-system" amix-toolchain:ci
          echo "cold image build: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$HIT" != true ]; then
            mkdir -p "$RUNNER_TEMP/toolchain-image"
            docker save amix-toolchain:ci | zstd -q -T0 -o "$RUNNER_TEMP/toolchain-image/image.tar.zst"
            ls -l "$RUNNER_TEMP/toolchain-image"
          fi
      - name: save the toolchain image
        if: steps.image.outputs.cache-hit != 'true' && steps.image2.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/toolchain-image
          key: ${{ steps.image.outputs.cache-primary-key }}
      - name: the image's gcc14 is the pinned build
        run: toolchain/extract-g14.sh --check amix-toolchain:ci
      # The lock's image line covers the toolchains; this is every file in the image.
      - name: every file in the image
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          cd "$RUNNER_TEMP/image"
          python3 -I "$GITHUB_WORKSPACE/toolchain/image-manifest" amix-toolchain:ci | gzip -n > ci.manifest.gz
          if docker image inspect amix-toolchain:cached > /dev/null 2>&1; then
            python3 -I "$GITHUB_WORKSPACE/toolchain/image-manifest" amix-toolchain:cached | gzip -n > cached.manifest.gz
            rc=0; diff <(zcat cached.manifest.gz) <(zcat ci.manifest.gz) > cached-vs-cold.diff || rc=$?
            [ "$rc" -le 1 ]
            echo "the cold image against the cached one: $(grep -c '^[<>]' cached-vs-cold.diff || true) lines differ" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # A fresh ext4 has its own directory hash seed, wherever its file sits. The
      # file is sparse: only what the second clone writes takes space.
      - name: another filesystem for the second clone
        run: |
          where=/; if mountpoint -q /mnt; then where=/mnt; fi
          sudo truncate -s 16G "${where%/}/elsewhere.img"
          sudo mkfs.ext4 -q -m 0 "${where%/}/elsewhere.img"
          mkdir "$RUNNER_TEMP/elsewhere"
          sudo mount -o loop "${where%/}/elsewhere.img" "$RUNNER_TEMP/elsewhere"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$RUNNER_TEMP/elsewhere/proof"
          df -hT "$RUNNER_TEMP/elsewhere"
      - name: make dist twice, the locks compared
        timeout-minutes: 180
        env:
          AMIX_IMAGE: amix-toolchain:ci
          SYSTEM: ${{ runner.temp }}/amix-system
          # the stock packages come from release assets; the private lists stay private
          RELEASE_PUBLIC: 1
          ELSEWHERE: ${{ runner.temp }}/elsewhere/proof
          LOCK_OF_RECORD: ${{ inputs.lock }}
        run: |
          if [ -n "$LOCK_OF_RECORD" ]; then
            [ -f "$LOCK_OF_RECORD" ] || { echo "no lock of record $LOCK_OF_RECORD" >&2; exit 1; }
            export LOCK=$PWD/$LOCK_OF_RECORD
          fi
          rc=0
          sh build/dist-proof "$RUNNER_TEMP/proof" || rc=$?
          { echo '### make dist twice'; echo '```'; cat "$RUNNER_TEMP/proof/summary"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      # A failed run's trees are still there: this says whether either disk filled.
      - name: the disks after the proof
        if: always()
        run: |
          { echo '### the disks after the proof'; echo '```'
            df -hT "$RUNNER_TEMP" "$RUNNER_TEMP/elsewhere" || true
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: the locks, the step logs, the catalogs and the image's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-proof
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/proof/summary
            ${{ runner.temp }}/proof/**/step-*.log
            ${{ runner.temp }}/proof/**/amix/out/lock
            ${{ runner.temp }}/proof/**/amix/out/build/*.log
            ${{ runner.temp }}/proof/**/amix/out/*/catalog
            ${{ runner.temp }}/proof/**/amix/out/*/catalog.md5
            ${{ runner.temp }}/elsewhere/proof/**/step-*.log
            ${{ runner.temp }}/elsewhere/proof/**/amix/out/lock
            ${{ runner.temp }}/elsewhere/proof/**/amix/out/build/*.log
            ${{ runner.temp }}/elsewhere/proof/**/amix/out/*/catalog
            ${{ runner.temp }}/elsewhere/proof/**/amix/out/*/catalog.md5
            ${{ runner.temp }}/image/*
