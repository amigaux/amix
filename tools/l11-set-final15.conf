# l11-set.conf -- what the 1.1 media carry, read by
# tools/build-l11-inputs.sh --set. One item per line; paths are relative to the
# workspace (the directory holding this repository):
#
#   dlm REV          amix-dlm, for the host readers (kbootset, lsstore, nlmake)
#   pkgtools REV     amix (userland/pkgtools at REV, built by build-l11-inputs): the
#                    host pkgtrans/pkgmk, the miniroot's static pkgadd set, the static
#                    apkg on /install/l11 (FILE+RAW; the box apkg needs libnsl.so, which
#                    the miniroot lacks), apkg-host and apkg-http, gen-catalog (which
#                    writes the media catalog) and `make dist` (APKG, APKGENG);
#                    nothing in 1.1 reads the frozen amix-packagemanager
#   kspace DIR       amix-packages' kernel-space build: the record (DIR/repo/catalog +
#                    DIR/pkg/) or a candidate root (DIR/catalog + DIR/pkgs/); each row
#                    found there (INPUTS says whether gen-catalog wrote the same)
#   staging DIR      the package staging the installed system comes from ...
#   apkg-pkg FILE [MD5]    ... with its base/APKG replaced by this datastream; dist/<name>
#                    is pkgtools' make dist output, held to MD5 (not minted until release prep)
#   apkgeng-pkg FILE [MD5] ... and its base/APKGENG (the installed engine) by this one
#   stock-pkg FILE [MD5]   ... and this stock datastream added to its stock/
#   rows FILE        catalog rows taken verbatim when kspace's catalog no longer has them
#                    (a superseded package the set keeps; its datastream in pkg/superseded/)
#   pkg NAME VERSION a catalog entry of kspace's catalog: an ordinary row
#                    (kbootset, modtools) or a #kpkg row (the loader, the kernels,
#                    the modules); its datastream is DIR/pkg/<the row's file name>
#
# Every 1.1 profile's KERNEL_KPKG and KERNEL_MODPKGS must be here (build-install-iso.sh
# refuses otherwise).
dlm c3b1818
# pkgtools at amix c3b1818; APKG 0.3.10 (passes -S) and APKGENG 1.12.8 (pkgadd prints no notice) beside the candidate
pkgtools c3b1818
# the kernel-space candidate root 15f96d8d (kabi 1.4, amix f286c88, gcc-cross-amix 33ebadc): kern30m -68,
# kern46m -57 (both name kbootset -35 as their floor), kbootset -35 (`kbootset cards` reads hex
# controller numbers), loader-amix -12, modtools -11, dlmkit -18, zz9ksvc 1.0.0-3; cdfs 1.1.0-6 demand
# class (loaded at its first mount), z3660rtg 1.1.1-3 (depends on monsw), the modules' node classes
# zeth 1.0.0-12, zscsi 1.0.0-7
# the final candidate 6cb9f795: as 280281c4 but dlmkit30/46 -19 (the kit pinned at amix 83ef3b4, port 4c363c3)
# the final candidate 8f961cf2 (amix 14b94e5): kern30m -71, kern46m -62, kbootset -37 (the kernels' floor),
# modtools -13, dlmkit30/46 -20 (the kit at amix 18102d7); the modules as in 1f4932c1
# the final14 candidate 77bb001d: as 8f961cf2 but loader-amix 1.0.261104-13 (boot2 with the RAM-disk placement fallback)
# the final15 candidate bf981c50: as 77bb001d but modtools 1.0.261104-14 (adds modadmin(1M), binary as -13)
# the final15 candidate 35fea4b8 (amix ce471af): as bf981c50 but kbootset -38, kern46m -62.1 (a new notice, the same objects), notices only: cdfs -8, gayle -9, paula -3, z3660rtg -4, a4kt710 -8
# the final15 candidate cae0bca3 (amix 61af0a1): as 35fea4b8 but notices only: kern30m -71.1, kern46m -62.2, zz9ksvc -4
# the final15 candidate ad562082 (amix c3b1818): as cae0bca3 but notices only: kern30m -71.2, kern46m -62.3
kspace amix-packages/build/kspace/candidate-ad562082
staging amix-installng/build/pins/staging
apkg-pkg amix-packages/build/kspace/candidate-ad562082/beside/APKG-0.3.10.pkg 53426b21d4312d3e274de604386b3cf1
apkgeng-pkg amix-packages/build/kspace/candidate-ad562082/beside/APKGENG-1.12.8.pkg 678a780857c50514ab534e080589fd4f
