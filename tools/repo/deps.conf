# deps.conf — authored dependency graph for the Amix package repo.
#
# The stock SVR4 metadata carries NO dependency information (verified on the
# bench, Session 1): no `depend` files, CLASSES=none, zero install scripts.
# This graph is therefore authored fresh from knowledge of what the packages
# actually are.  gen-catalog.py reads it and fills each catalog line's deps
# field; apkg resolves it recursively (deps installed first).
#
# Format: "<catalog-name>: <dep>,<dep>,..."  (lowercase catalog names;
# '#' comments and blank lines ignored).  A package absent here = deps=none.
#
# Principles:
#   * `core` is the essential base OS — you cannot boot Amix without it, so
#     it is ALWAYS present and is never listed as a dependency.
#   * NO "you need a compiler" dependencies.  A compiler is the user's choice
#     (the AT&T `cdev` OR the community GCC 2.7.2.3 pkg both satisfy it), so
#     hard-linking to `cdev` would over-constrain — and installing a source
#     tree just to read it is perfectly legitimate.  Source packages, the
#     kernel-config package, and the dev tools therefore pull in NO compiler.
#     Install whichever compiler you want alongside them.
#   * Only genuinely non-substitutable, runtime-structural dependencies are
#     declared: the X11 stack, where a client or dev framework needs the X
#     server / libraries / headers that ONLY xcore (or olcore) provides.
#
# Pure metadata: edit this file and re-run gen-catalog.py — no rebuild.

# ---- X11 stack (runtime-structural: the X server + libraries) ----
xbasic:   xcore
xtras:    xcore
olcore:   xcore
xdev:     xcore
oldev:    olcore,xdev

# ---- the package system itself ----
# apkg's default config drives /usr/apkg/bin/pkgadd from apkgeng (the fixed
# heirloom engine).  apkg falls back to stock /usr/sbin/pkgadd if apkgeng is
# absent, so this is the "intended complete system" rather than a hard block.
apkg:     apkgeng

# ---- CD/optical filesystem userland ----
# cdfs ships the /usr/lib/fs/cdfs/mount helper (+ the /cdrom mount point) so an
# installed box can mount CDs.  The cdfs KERNEL side already ships in the target
# kernel (core); the helper is useless without core's kernel + shared libc.  So
# unlike the general rule above (`core` is the always-present base and is never
# a declared dependency), cdfs declares `core` explicitly and deliberately: an
# alt-root/miniroot install MUST land core first (see core-first-gate.sh), and
# the edge makes that ordering explicit for apkg's recursive resolver.  On a
# normally-booted box core is always present, so the edge is a no-op there.
cdfs:     core

# ---- kernel packages (PRIVATE-only; never in the redistributable catalog) ----
# KERNBENCH/KERNZ3660 ship /stand/unix + /stand/boot2.boot, which are
# proprietary-derived (W6-K section 3).  The publish path REFUSES them and
# they are minted into a separate private staging, so they never appear in the
# public catalog and gen-catalog never actually looks these edges up.  They are
# recorded here to DOCUMENT the dependency (and for any private/local catalog
# or the installng consumer's resolver): like cdfs, they name `core`
# explicitly -- the /stand skeleton and shared libc come from core, which an
# alt-root/miniroot install must land first (core-first-gate.sh).
kernbench: core
kernz3660: core

# ---- demo packages (E2E test fixtures) ----
amixdemo: demolib

# Deliberately NO dependencies (compiler is the user's choice; source is
# readable without building): the source packages amigasrc, emacsrc, gnusrc,
# gnusrc2, pubsrc, xsource, x11r5src; the kernel-config package conf; and
# games/emacs->terminfo (console works via core's termcap; terminfo only adds
# non-Amiga terminal support).
