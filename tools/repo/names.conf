# names.conf -- authored CATALOG-NAME mappings for the Amix package repo.
#
# gen-catalog.py's default catalog name is the pkginst lowercased, which is
# right for almost everything we ship: PKG=core -> core, PKG=APKG -> apkg,
# PKG=grep -> grep.  This file is the override for the one case where it is
# not: a package whose SVR4 instance name and whose user-facing name cannot
# be the same string.
#
# Format: one statement per line, '#' comments and blank lines ignored:
#
#     <PKGINST>: <catalog-name>
#
# The key is the pkginfo PKG value EXACTLY as it appears there (this is the
# one conf file keyed on pkginst rather than on the catalog name -- it is
# what produces the catalog name, so it cannot be keyed on its own output).
# The value must match [A-Za-z0-9][A-Za-z0-9+.-]* and carry no '|';
# gen-catalog.py refuses the package otherwise.
#
# The catalog carries BOTH strings -- `name|version|pkginst|...` -- so the
# mapping costs nothing on the box: apkg resolves and displays the catalog
# name, and hands the pkginst to the engine for pkgadd/pkgrm/the /var/sadm
# record.  Nothing is renamed and no .pkg byte moves.
#
# ---------------------------------------------------------------------------
# STAGING.  The publish path copies this file into the staging root beside
# deps.conf (and descs.conf, cats.conf).  Like descs.conf, and unlike
# cats.conf (which moves stock lines on purpose), that is safe at any time:
# a package absent here keeps the default lowercased pkginst, so staging
# this file moves exactly the lines named below and no others.  Keep that
# property.
#
# ---------------------------------------------------------------------------

# amix-benchmark -- OUR OWN benchmark suite (sibling repo amix-packages,
# recipes/amix-benchmark; registry `catalog_name: amix-benchmark`).
#
# The two names are forced apart by a hard constraint, not by taste:
# `amix-benchmark` is 14 characters and the SVR4 PKG instance may not exceed
# 9 -- stock Amix pkgadd SILENTLY DROPS a longer one (CONTRIBUTING.md constraint 1,
# enforced by build-packages.sh and by gen-catalog.py's Gate 7).  So the
# instance is `amixbench` and the readable name a user types at `apkg
# install` is `amix-benchmark`.  This is the first package in the catalog
# where the two differ; every earlier one fit in 9 characters.
amixbench: amix-benchmark

# gtar -- GNU tar 1.14 from amix-packages (recipes/tar; registry
# `catalog_name: tar`).  The PKG instance is `gtar` so it never collides with
# stock tar in `core`; the catalog name a user types at `apkg install` is
# `tar`.  Batch-2 (2026-09-26), alongside the grep 2.5.1a-2 refresh and make
# (make needs no override -- its own PKG instance IS `make`).
gtar: tar

# diffutil / coreutil -- GNU diffutils 2.8.1 and coreutils 5.2.1 from
# amix-packages (recipes/diffutils, recipes/coreutils; registry
# `catalog_name: diffutils` / `coreutils`).  The 9-char limit forces the
# 8-char instances; the catalog names a user types are the upstream ones.
# Unpublished; mapped 2026-10-30 so the `extra` set names real catalog lines.
diffutil: diffutils
coreutil: coreutils
