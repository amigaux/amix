# sets.conf — the named install sets offered by the Amix installer.
#
# Five INSTALLER sets, locked 2026-08-11 (installer-UX rework
# plan §8.4).  The installer's package menu offers these by name; "Custom" is
# not a set, it is the absence of one.
#
# A sixth set, `extra`, is declared at the bottom.  It is NOT an installer
# menu choice and NOT part of the composition chain — it is the post-install
# handle for the add-on userland from the sibling amix-packages repo.  Read
# its comment before touching it; the five locked memberships must not move.
#
# Pure metadata, like deps.conf and cats.conf: this file names packages, it
# does not order them and it does not resolve dependencies.  Ordering stays
# with the core-first gate and apkg's recursive resolver.
#
# ---------------------------------------------------------------------------
# GRAMMAR (one statement per line; '#' comments and blank lines ignored):
#
#     <set>: <member>[,<member>]...
#
#   <set>      a set name, [a-z][a-z0-9-]*
#   <member>   either a catalog package name (lowercase, as it appears in
#              the catalog's first field), or '+<set>' meaning "every
#              member of <set>", resolved transitively.
#
#   A set may be declared on SEVERAL lines; members accumulate, so a long
#   set stays readable without long lines.  Order within a set is not
#   meaningful (the resolver returns a sorted, de-duplicated membership).
#   Include cycles are an error, not a hang.
#
# WHY THIS SHAPE.  It has to be read by two very different consumers:
#   * host python (tools/repo/sets.py — also the reference resolver), and
#   * a 1991 pre-POSIX Bourne sh loop on the miniroot, where the whole
#     toolbox is sed/grep/tr/while-read and there are no arrays.
#   One line per statement, one ':' per line, one separator character, no
#   quoting and no continuation lines is about the largest grammar that
#   stays a two-liner in that sh:
#
#     sed -n "s/^$want:[ 	]*//p" sets.conf | tr ',' ' '
#
#   plus a small loop to expand '+' members.  Anything with sections,
#   nesting or quoting would have cost more sh than it saved.
#
# ---------------------------------------------------------------------------
# THE SETS.  Composition is a strict chain — minimal ⊂ standard ⊂ {full,
# developer, x11} — so every set is written as a delta and the base-8 story
# is stated once.  Resolved memberships are spelled out at the bottom of
# this file; tools/repo/tests/run-tests.sh asserts them, so the comment
# cannot silently rot.

# --- minimal: the proven base-8 -------------------------------------------
# Exactly the eight packages the metal installer has been installing and
# digest-attesting end to end since M-RUN2.  Do not extend this set without
# re-attesting the reference digest: it IS the regression identity.
minimal:   core,bsd,net,text,sysadm
minimal:   cdfs,apkgeng,apkg

# --- standard: the tape's own default ------------------------------------
# The 14 stock packages the original Amix 2.1 tape index (hdf/tape21/x00/List)
# does NOT mark opt=y — i.e. what Commodore installed unless you said
# otherwise — plus our three base packages.  minimal's five stock members are
# all inside those 14, so this is a clean superset.
standard:  +minimal
standard:  cdev,lp,man,public,terminfo,uucp
standard:  xcore,xbasic,olcore

# --- full: everything we ship ---------------------------------------------
# All 27 stock packages + cdfs/apkgeng/apkg = 30.  ~274 MB of payload by the
# catalog's #isize block (~297 MB by the tape's own 512-byte-block figures);
# how much guest RAM a `full` install needs headroom against is still an open
# measurement (plan §5 item 8) — the disk payload is unaffected by the guest
# RAM correction (2026-09-16; NOTES.md; was pinned to a since-retracted
# 16 MB ceiling, now 16-128 MB depending on kernel line), so treat "full
# fits" as unproven until W6 says so.
full:      +standard
full:      xtras,xdev,oldev,conf,emacs,games
full:      amigasrc,emacsrc,gnusrc,gnusrc2,pubsrc,xsource,x11r5src

# --- developer: standard + the X/OPEN LOOK dev tools ----------------------
# cdev (the AT&T C development system) is already in standard, so this set
# only adds the two toolkit dev packages.
#
# `conf` — the kernel configuration package — is DELIBERATELY EXCLUDED (user
# decision, plan §8.4).  It is not "the kernel relink kit is unwelcome": it
# is that conf's stock workflow ends in `make bootpart`, which frames a boot
# slice the way 1991 did and actively misleads against updbootpart, the
# flags-based reframing tool this project ships and gates (KSUM / boot2 /
# ROOTDEV).  Handing a `make bootpart` flow to someone who just chose
# "Developer" invites them to brick a boot slice.  Anyone who genuinely
# wants conf can select it in Custom.
developer: +standard
developer: xdev,oldev

# --- x11: standard + the X extras ----------------------------------------
# standard already carries the X stack proper (xcore, xbasic, olcore); this
# set is "standard, but I actually intend to use X", so it adds xtras.
x11:       +standard
x11:       xtras

# --- extra: the add-on userland, OFF the chain ----------------------------
# `extra` is the named handle for the packages minted by the sibling
# `amix-packages` repo — the modern GNU/BSD userland (gzip, tar, bash, less,
# screen, dropbear, ...) — which is NOT part of the Amix 2.1 distribution.
# Populated 2026-09-16 with BATCH-1, published 2026-09-15 (catalog 32 → 38;
# see NOTES.md's 2026-09-15 publish log for the per-package md5/size/version
# record). Further amix-packages batches land here as they publish.
#
# THREE RULES, and they are the reason this set exists at all:
#
#   1. `full` is NOT "every package in the catalog" — it is "the complete
#      Amix 2.1 distribution plus our three base packages", locked at 30 and
#      digest-attested.  Never add an amix-packages package to full (or to
#      any of the other four): it would move the locked memberships that the
#      metal installer's regression identity is built on.  extra and full
#      are disjoint, and the test suite asserts it.
#
#   2. `extra` is NOT part of the minimal ⊂ standard ⊂ {full, developer,
#      x11} chain and is not self-sufficient — it carries no OS.  It is not
#      an installer menu choice; it is a post-install group, the handle for
#      `apkg install $(sets.py extra)` on a box that is already up.
#
#   3. Provenance lives HERE, not in cats.conf.  An add-on is categorised by
#      what it does (gzip is `utility`, dropbear is `network`), beside the
#      stock package that does the same job; "we ported it" is what this set
#      says.  See the axis note at the top of cats.conf.
extra:     acompat,gzip,grep,less,patch,zlib
# amix-benchmark joins on publication (2026-09-16), the way BATCH-1 did.  It is
# the first member that is OUR OWN tool rather than a port -- provenance is
# still what this set means, and "we built it" and "we ported it" are the same
# side of that line.  Note it is the CATALOG name, as every member here is; its
# pkginst is the 9-char `amixbench`.
extra:     amix-benchmark
# tar and make join with amix-packages batch-2 (2026-09-26).  tar's catalog
# name is `tar`; its PKG instance is the 9-char `gtar` (tools/repo/names.conf)
# so it never collides with stock tar in `core`.  make needs no override --
# its own PKG instance IS `make`.
extra:     make,tar

