# NOT IN ANY SET, and not by accident:
#   kernbench / kernz3660 — the PRIVATE kernel packages.  They are refused
#   from any redistributable catalog by the KSUM_R/BOOT2_SHA marker gates in
#   gen-catalog.py and publish.sh, and are delivered by updbootpart, not by
#   a menu.  Never add a KERN* package to a set; never weaken those gates to
#   make one selectable.
#   amixdemo / demolib — apkg E2E test fixtures, not products.
