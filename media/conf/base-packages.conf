# base-packages.conf -- the userland packages a medium carries beside the stock set, for the
# installer to add after core (the disc's /install/l11/base), in this order.
#
#   <catalog name> [<set>...]
#
# Each takes its row and datastream from make dist's release tree (out/release/<v>/catalog and
# pkgs/). With no set named every set takes it; with sets, only those sets do.
libcfix
amix-base
amixrt
dhcp-client
syslog
ftpdfix
dropbear
rdate
cdfs
heirloom-tar
x11r6.3 x11 full
