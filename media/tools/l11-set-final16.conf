# l11-set.conf -- what the 1.1 media carry, read by
# tools/build-l11-inputs.sh --set. One item per line; paths are relative to the
# workspace (the directory holding this repository):
#
#   dlm REV          amix-dlm, for the host readers (kbootset, lsstore, nlmake)
#   pkgtools REV     amix (userland/pkgtools at REV, built by build-l11-inputs): the
#                    host pkgtrans/pkgmk, the miniroot's static pkgadd set, the static
#                    apkg on /install/l11 (FILE+RAW; the box apkg needs libnsl.so, which
#                    the miniroot lacks), apkg-host and apkg-http, gen-catalog (which
#                    writes the media catalog) and `make dist` (APKG, APKGENG);
#                    nothing in 1.1 reads the frozen amix-packagemanager
#   kspace DIR       amix-packages' kernel-space build: the record (DIR/repo/catalog +
#                    DIR/pkg/) or a candidate root (DIR/catalog + DIR/pkgs/); each row
#                    found there (INPUTS says whether gen-catalog wrote the same)
#   lock FILE        make dist's out/lock, before the pkg lines: each kspace datastream and
#                    kspace beside/amix-cdboot (which the media then carry) must be its line
#   staging DIR      the package staging the installed system comes from ...
#   apkg-pkg FILE [MD5]    ... with its base/APKG replaced by this datastream; dist/<name>
#                    is pkgtools' make dist output, held to MD5 (not minted until release prep)
#   apkgeng-pkg FILE [MD5] ... and its base/APKGENG (the installed engine) by this one
#   stock-pkg FILE [MD5]   ... and this stock datastream added to its stock/
#   rows FILE        catalog rows taken verbatim when kspace's catalog no longer has them
#                    (a superseded package the set keeps; its datastream in pkg/superseded/)
#   pkg NAME VERSION a catalog entry of kspace's catalog: an ordinary row
#                    (kbootset, modtools) or a #kpkg row (the loader, the kernels,
#                    the modules); its datastream is DIR/pkg/<the row's file name>
#
# Every 1.1 profile's KERNEL_KPKG and KERNEL_MODPKGS must be here (build-install-iso.sh
# refuses otherwise).

# final16: make dist at amix cdf6c05, the candidate d630412a (release catalog md5), read-only in place
dlm cdf6c05
pkgtools cdf6c05
# kernel space is make dist's, held to its lock (298 lines); amix-cdboot comes from its beside/
kspace tmp/2026-11-07-final16-candidate/amix/out/kspace
lock tmp/2026-11-07-final16-candidate/amix/out/lock
staging amix-installng/build/pins/staging
apkg-pkg tmp/2026-11-07-final16-candidate/amix/out/apkg/APKG-0.3.11.pkg 00d960ae60045708f64a685edcc77267
# APKGENG 1.12.10 (the quit path reads no stdin). The fix is in libpkg, so pkgtools cdf6c05 rebuilds the
# miniroot's static engine: the RAM disks are rebuilt
